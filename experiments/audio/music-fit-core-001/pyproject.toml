[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ziro-musicfit-core"
version = "0.2.0a1"
description = "Bounded CPU-only BGM fitting core and JSON worker candidate"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "soundfile==0.13.1"]

[tool.setuptools.packages.find]
include = ["musicfit*"]
