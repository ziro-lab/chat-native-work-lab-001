name: YMM4 VOICEVOX public speaker route inventory
on:
  workflow_dispatch:
  push:
    branches: ['lab/voicevox-public-speaker-route']
    paths:
      - 'experiments/ymm4/voicevox-public-speaker-route/**'
      - '.github/workflows/ymm4-voicevox-public-speaker-route.yml'
permissions:
  contents: read
concurrency:
  group: voicevox-public-speaker-route-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned YMM4
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          curl.exe -L --fail --retry 2 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.56.1.0/YukkuriMovieMaker_v4.56.1.0_Lite.zip
          if($LASTEXITCODE-ne0){throw 'Host download blocked'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()-ne'49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'){throw 'Host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          if($null-eq$exe){throw 'YMM4 executable not found'}
          $root=$exe.Directory.FullName
          "YMM4_DIR=$root\"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install
        shell: pwsh
        run: |
          dotnet build experiments/ymm4/voicevox-public-speaker-route/src/Ymm4VoiceVoxPublicSpeakerRouteProbe/Ymm4VoiceVoxPublicSpeakerRouteProbe.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/probe --nologo -warnaserror
          if($LASTEXITCODE-ne0){throw 'Build failed'}
          $dest=Join-Path $env:YMM4_DIR 'user/plugin/Ymm4VoiceVoxPublicSpeakerRouteProbe'
          New-Item -ItemType Directory -Force $dest|Out-Null
          Copy-Item out/probe/Ymm4VoiceVoxPublicSpeakerRouteProbe.dll $dest
      - name: Native probe
        shell: pwsh
        run: ./experiments/ymm4/voicevox-public-speaker-route/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out/evidence')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voicevox-public-speaker-route
          path: out/evidence/
          if-no-files-found: error
          retention-days: 7
