name: YMM4 no-Harmony P4 hands-on candidate
on:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-p4-hands-on-candidate/**'
      - '.github/workflows/ymm4-no-harmony-p4-hands-on-candidate.yml'
permissions: { contents: read }
concurrency:
  group: p4-hands-on-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      HOST_VERSION: '4.56.1.0'
      HOST_HASH: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1

      - name: Acquire pinned host
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip "https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v$env:HOST_VERSION/YukkuriMovieMaker_v$($env:HOST_VERSION)_Lite.zip"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED host download'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:HOST_HASH){throw 'BLOCKED host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          if(-not $exe){throw 'BLOCKED host executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exact hands-on candidate
        shell: pwsh
        env:
          SOURCE_HEAD: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: |
          dotnet build experiments/ymm4/no-harmony-p4-hands-on-candidate/src/Plugin/Plugin.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/plugin --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Candidate build failed'}
          if(Get-ChildItem out/plugin -Filter '*Harmony*.dll'){throw 'Unexpected Harmony dependency'}

          $package=Join-Path $PWD 'out/package/Ymm4NoHarmonyFolderHandsOn'
          New-Item -ItemType Directory -Force $package|Out-Null
          Copy-Item out/plugin/Ymm4NoHarmonyFolderHandsOn.dll $package
          Copy-Item experiments/ymm4/no-harmony-p4-hands-on-candidate/README.md (Join-Path $package 'README.md')

          New-Item -ItemType Directory -Force out/evidence|Out-Null
          @(
            "source_head=$env:SOURCE_HEAD",
            "checkout=$(git rev-parse HEAD)",
            "tree=$(git rev-parse 'HEAD^{tree}')",
            "host_version=$env:HOST_VERSION",
            "host_zip_sha256=$env:HOST_HASH",
            "candidate_sha256=$((Get-FileHash out/plugin/Ymm4NoHarmonyFolderHandsOn.dll -Algorithm SHA256).Hash)",
            "run=$env:GITHUB_RUN_ID",
            "level=P4-hands-on-smoke"
          )|Set-Content out/evidence/manifest.txt

      - name: Install exact candidate into smoke host
        shell: pwsh
        run: |
          $d=Join-Path $env:YMM4_DIR 'user\plugin\Ymm4NoHarmonyFolderHandsOn'
          New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item out/plugin/Ymm4NoHarmonyFolderHandsOn.dll $d

      - name: Startup / attach smoke
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class P4HandsOnWindow {
            public delegate bool Callback(IntPtr w, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Callback cb,IntPtr p);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr w);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr w,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr w,StringBuilder s,int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr w,uint m,IntPtr wp,IntPtr lp);
          }
          '@

          $diag=Join-Path $PWD 'out/evidence/smoke'
          New-Item -ItemType Directory -Force $diag|Out-Null
          $env:CNWL_P4_HANDS_ON_DIAG_DIR=$diag
          $env:CNWL_P4_HANDS_ON_SMOKE_CREATE_PROJECT='1'

          $p=Start-Process (Join-Path $env:YMM4_DIR 'YukkuriMovieMaker.exe') -WorkingDirectory $env:YMM4_DIR -PassThru
          try {
            $script:hostPid=$p.Id
            $cb=[P4HandsOnWindow+Callback]{
              param([IntPtr]$w,[IntPtr]$unused)
              [uint32]$owner=0
              [void][P4HandsOnWindow]::GetWindowThreadProcessId($w,[ref]$owner)
              if($owner -eq $script:hostPid -and [P4HandsOnWindow]::IsWindowVisible($w)){
                $s=New-Object System.Text.StringBuilder 1024
                [void][P4HandsOnWindow]::GetWindowText($w,$s,1024)
                $title=$s.ToString()
                if($title -like '*Check for updates*' -or $title -like '*About YukkuriMovieMaker*'){
                  [void][P4HandsOnWindow]::PostMessage($w,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)
                }elseif($title -eq 'Confirm' -or $title -eq 'Profile'){
                  [void][P4HandsOnWindow]::PostMessage($w,0x0100,[IntPtr]0x0D,[IntPtr]::Zero)
                  [void][P4HandsOnWindow]::PostMessage($w,0x0101,[IntPtr]0x0D,[IntPtr]::Zero)
                }
              }
              return $true
            }

            $ready=Join-Path $diag 'ready.txt'
            $deadline=[DateTime]::UtcNow.AddSeconds(90)
            while([DateTime]::UtcNow -lt $deadline -and -not $p.HasExited -and -not(Test-Path $ready)){
              [void][P4HandsOnWindow]::EnumWindows($cb,[IntPtr]::Zero)
              Start-Sleep -Milliseconds 400
            }

            if(-not(Test-Path $ready)){
              if(Test-Path (Join-Path $diag 'runtime.log')){Get-Content (Join-Path $diag 'runtime.log') -Tail 100|Write-Host}
              throw 'Hands-on candidate did not attach to an active Timeline'
            }

            Get-Content $ready|Write-Host
            Get-Content (Join-Path $diag 'runtime.log') -Tail 100|Write-Host
            'PASS_P4_HANDS_ON_STARTUP'|Set-Content (Join-Path $diag 'PASS_P4_HANDS_ON_STARTUP.txt')
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:CNWL_P4_HANDS_ON_DIAG_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:CNWL_P4_HANDS_ON_SMOKE_CREATE_PROJECT -ErrorAction SilentlyContinue
          }

      - name: Verify packaged bits equal tested bits
        shell: pwsh
        run: |
          $built=(Get-FileHash out/plugin/Ymm4NoHarmonyFolderHandsOn.dll -Algorithm SHA256).Hash
          $packed=(Get-FileHash out/package/Ymm4NoHarmonyFolderHandsOn/Ymm4NoHarmonyFolderHandsOn.dll -Algorithm SHA256).Hash
          $installed=(Get-FileHash (Join-Path $env:YMM4_DIR 'user\plugin\Ymm4NoHarmonyFolderHandsOn\Ymm4NoHarmonyFolderHandsOn.dll') -Algorithm SHA256).Hash
          if($built -ne $packed -or $built -ne $installed){throw 'Candidate identity mismatch'}
          "tested_candidate_sha256=$built"|Add-Content out/evidence/manifest.txt

      - if: always()
        name: Show evidence
        shell: pwsh
        run: |
          if(Test-Path out/evidence/manifest.txt){Get-Content out/evidence/manifest.txt}
          if(Test-Path out/evidence/smoke/runtime.log){Get-Content out/evidence/smoke/runtime.log -Tail 100}

      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-no-harmony-p4-hands-on-candidate-4.56.1.0
          path: out/package/
          retention-days: 30

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-no-harmony-p4-hands-on-evidence-4.56.1.0
          path: out/evidence/
          retention-days: 30
