name: fsld-musicfit-benchmark-001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/audio/fsld-musicfit-benchmark-001/**'
      - 'experiments/audio/fsld-commercial-safe-index-001/**'
      - 'experiments/audio/commercial-safe-corpus-001/**'
      - 'experiments/audio/music-fit-core-001/**'
      - '.github/workflows/fsld-musicfit-benchmark-001.yml'
  pull_request:
    paths:
      - 'experiments/audio/fsld-musicfit-benchmark-001/**'
      - 'experiments/audio/fsld-commercial-safe-index-001/**'
      - 'experiments/audio/commercial-safe-corpus-001/**'
      - 'experiments/audio/music-fit-core-001/**'
      - '.github/workflows/fsld-musicfit-benchmark-001.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Music Fit CPU dependencies
        run: python -m pip install -r experiments/audio/music-fit-core-001/requirements.txt
      - name: Run 48-source commercial-safe FSLD diagnostic
        working-directory: experiments/audio/fsld-musicfit-benchmark-001
        run: python run_benchmark.py
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: fsld-musicfit-benchmark-001-evidence
          path: experiments/audio/fsld-musicfit-benchmark-001/out/report.json
          if-no-files-found: error
          retention-days: 14
