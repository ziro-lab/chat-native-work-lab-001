name: YMM4 tachie refresh surface
on:
  workflow_dispatch:
  push:
    branches: ['lab/ymm4-tachie-refresh-surface']
    paths:
      - 'experiments/ymm4/tachie-refresh-surface/**'
      - '.github/workflows/ymm4-tachie-refresh-surface.yml'
permissions:
  contents: read
concurrency:
  group: ymm4-tachie-refresh-surface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Download exact YMM4 4.56.1.0 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.56.1.0/YukkuriMovieMaker_v4.56.1.0_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'download failed' }
          $hash=(Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'){throw "hash mismatch: $hash"}
          $hash | Set-Content ymm4-sha256.txt
          Expand-Archive ymm4.zip -DestinationPath ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if(-not $exe){throw 'exe missing'}
          "YMM4_DIR=$($exe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and scan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/probe,out/evidence | Out-Null
          dotnet build experiments/ymm4/tachie-refresh-surface/Ymm4TachieRefreshSurface.csproj -c Release -o out/probe --nologo -warnaserror
          dotnet out/probe/Ymm4TachieRefreshSurface.dll "$env:YMM4_DIR" (Join-Path $PWD 'out/evidence') 2>&1 | Tee-Object out/evidence/run.txt
          if($LASTEXITCODE -ne 0){throw 'scan failed'}
      - name: Record provenance
        if: always()
        shell: pwsh
        run: |
          [ordered]@{schema='chat-native-work-lab.provenance.v1';experiment='ymm4-tachie-refresh-surface';source_head=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;ymm4_version='4.56.1.0 Lite';ymm4_zip_sha256=(Get-Content -Raw ymm4-sha256.txt).Trim()} | ConvertTo-Json | Set-Content out/evidence/provenance.json
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-tachie-refresh-surface
          path: |
            out/evidence/
            ymm4-sha256.txt
          retention-days: 14
          if-no-files-found: warn