name: YMM4 no-Harmony P5 third-party item

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-p4-hands-on-candidate/**'
      - '.github/workflows/ymm4-no-harmony-p5-third-party.yml'

permissions:
  contents: read

concurrency:
  group: p5-third-party-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '4.55.1.1'
            sha256: '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b'
          - version: '4.56.1.0'
            sha256: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'

    runs-on: windows-latest
    timeout-minutes: 14

    env:
      YMM43D_COMMIT: 'a5fe44443d9b62912dec6861edf68cbdff9e7810'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1

      - name: Acquire pinned host
        shell: pwsh
        env:
          HOST_VERSION: '${{ matrix.version }}'
          HOST_HASH: '${{ matrix.sha256 }}'
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip "https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v$env:HOST_VERSION/YukkuriMovieMaker_v$($env:HOST_VERSION)_Lite.zip"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED host download'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:HOST_HASH){throw 'BLOCKED host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          if(-not $exe){throw 'BLOCKED host executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch pinned YMM43D source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external|Out-Null
          git -C external init YMM43D
          git -C external/YMM43D remote add origin https://github.com/Dolphin-kun/YMM43D.git
          git -C external/YMM43D fetch --depth=1 origin $env:YMM43D_COMMIT
          git -C external/YMM43D checkout --detach FETCH_HEAD
          $actual=(git -C external/YMM43D rev-parse HEAD).Trim()
          if($actual -ne $env:YMM43D_COMMIT){throw "YMM43D commit mismatch: $actual"}
          $license=Get-Content external/YMM43D/LICENSE.txt -Raw
          if($license -notmatch 'MIT License'){throw 'YMM43D license marker missing'}

      - name: Build pinned YMM43D
        shell: pwsh
        run: |
          dotnet build external/YMM43D/YMM43D/YMM43D.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/thirdparty --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'YMM43D build failed'}
          $dll=Join-Path $PWD 'out/thirdparty/YMM43D.dll'
          if(-not(Test-Path $dll)){throw 'YMM43D.dll missing'}
          if(Get-ChildItem out/thirdparty -File | Where-Object { $_.Name -in @('0Harmony.dll','HarmonyLib.dll') }){
            throw 'Unexpected Harmony in YMM43D output'
          }
          $d=Join-Path $env:YMM4_DIR 'user\plugin\YMM43D'
          New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item $dll $d

          New-Item -ItemType Directory -Force out/evidence|Out-Null
          @(
            "third_party_repo=Dolphin-kun/YMM43D",
            "third_party_commit=$env:YMM43D_COMMIT",
            "third_party_license=MIT",
            "third_party_dll_sha256=$((Get-FileHash $dll -Algorithm SHA256).Hash)"
          )|Set-Content out/evidence/third-party.txt

      - name: Build folder candidate
        shell: pwsh
        run: |
          dotnet build experiments/ymm4/no-harmony-p4-hands-on-candidate/src/Plugin/Plugin.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/plugin --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Candidate build failed'}
          $harmony=Get-ChildItem out/plugin -File | Where-Object { $_.Name -in @('0Harmony.dll','HarmonyLib.dll') }
          if($harmony){throw ('Unexpected Harmony dependency: ' + ($harmony.Name -join ','))}
          $d=Join-Path $env:YMM4_DIR 'user\plugin\Ymm4NoHarmonyFolderHandsOn'
          New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item out/plugin/Ymm4NoHarmonyFolderHandsOn.dll $d
          @(
            "source_head=${{ github.event.pull_request.head.sha || github.sha }}",
            "host_version=${{ matrix.version }}",
            "host_zip_sha256=${{ matrix.sha256 }}",
            "candidate_sha256=$((Get-FileHash out/plugin/Ymm4NoHarmonyFolderHandsOn.dll -Algorithm SHA256).Hash)",
            "run=$env:GITHUB_RUN_ID"
          )|Set-Content out/evidence/manifest.txt

      - name: Run P5 third-party custom-item smoke
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class P5ThirdPartyWindow {
            public delegate bool Callback(IntPtr w, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Callback cb,IntPtr p);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr w);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr w,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr w,StringBuilder s,int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr w,uint m,IntPtr wp,IntPtr lp);
          }
          '@

          $diag=Join-Path $PWD 'out/evidence/smoke'
          New-Item -ItemType Directory -Force $diag|Out-Null
          $env:CNWL_P4_HANDS_ON_DIAG_DIR=$diag
          $env:CNWL_P4_HANDS_ON_SMOKE_CREATE_PROJECT='1'
          $env:CNWL_P5_THIRD_PARTY_SMOKE='1'

          $p=Start-Process (Join-Path $env:YMM4_DIR 'YukkuriMovieMaker.exe') -WorkingDirectory $env:YMM4_DIR -PassThru
          try {
            $script:hostPid=$p.Id
            $cb=[P5ThirdPartyWindow+Callback]{
              param([IntPtr]$w,[IntPtr]$unused)
              [uint32]$owner=0
              [void][P5ThirdPartyWindow]::GetWindowThreadProcessId($w,[ref]$owner)
              if($owner -eq $script:hostPid -and [P5ThirdPartyWindow]::IsWindowVisible($w)){
                $s=New-Object System.Text.StringBuilder 1024
                [void][P5ThirdPartyWindow]::GetWindowText($w,$s,1024)
                $title=$s.ToString()
                if($title -like '*Check for updates*' -or $title -like '*About YukkuriMovieMaker*'){
                  [void][P5ThirdPartyWindow]::PostMessage($w,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)
                }elseif($title -eq 'Confirm' -or $title -eq 'Profile'){
                  [void][P5ThirdPartyWindow]::PostMessage($w,0x0100,[IntPtr]0x0D,[IntPtr]::Zero)
                  [void][P5ThirdPartyWindow]::PostMessage($w,0x0101,[IntPtr]0x0D,[IntPtr]::Zero)
                }
              }
              return $true
            }

            $result=Join-Path $diag 'p5-third-party-result.txt'
            $deadline=[DateTime]::UtcNow.AddSeconds(160)
            while([DateTime]::UtcNow -lt $deadline -and -not $p.HasExited -and -not(Test-Path $result)){
              [void][P5ThirdPartyWindow]::EnumWindows($cb,[IntPtr]::Zero)
              Start-Sleep -Milliseconds 400
            }

            if(-not(Test-Path $result)){
              if(Test-Path (Join-Path $diag 'runtime.log')){Get-Content (Join-Path $diag 'runtime.log') -Tail 450|Write-Host}
              throw 'P5 third-party smoke did not produce a result'
            }

            $content=Get-Content $result
            $content|Write-Host
            if($content[0] -ne 'PASS_P5_THIRD_PARTY'){
              if(Test-Path (Join-Path $diag 'runtime.log')){Get-Content (Join-Path $diag 'runtime.log') -Tail 450|Write-Host}
              throw 'P5 third-party compatibility failed'
            }
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            foreach($name in @(
              'CNWL_P4_HANDS_ON_DIAG_DIR',
              'CNWL_P4_HANDS_ON_SMOKE_CREATE_PROJECT',
              'CNWL_P5_THIRD_PARTY_SMOKE'
            )){
              Remove-Item ("Env:"+$name) -ErrorAction SilentlyContinue
            }
          }

      - if: always()
        name: Show evidence
        shell: pwsh
        run: |
          if(Test-Path out/evidence/manifest.txt){Get-Content out/evidence/manifest.txt}
          if(Test-Path out/evidence/third-party.txt){Get-Content out/evidence/third-party.txt}
          if(Test-Path out/evidence/smoke/p5-third-party-result.txt){Get-Content out/evidence/smoke/p5-third-party-result.txt}
          if(Test-Path out/evidence/smoke/runtime.log){Get-Content out/evidence/smoke/runtime.log -Tail 450}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-no-harmony-p5-third-party-${{ matrix.version }}
          path: out/evidence/
          retention-days: 30
