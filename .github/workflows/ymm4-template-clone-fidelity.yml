name: YMM4 template clone fidelity

on:
  workflow_dispatch:
  push:
    branches: [experiment/ymm4-template-clone-fidelity]
    paths:
      - 'experiments/ymm4/template-clone-fidelity/**'
      - '.github/workflows/ymm4-template-clone-fidelity.yml'
  pull_request:
    paths:
      - 'experiments/ymm4/template-clone-fidelity/**'
      - '.github/workflows/ymm4-template-clone-fidelity.yml'

permissions:
  contents: read

concurrency:
  group: ymm4-template-clone-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-discovery:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks | Tee-Object -FilePath dotnet-sdks.txt
          if (-not (Select-String -Path dotnet-sdks.txt -Pattern '^10\.')) { throw '.NET 10 SDK missing' }
      - name: Download and verify exact YMM4 4.55.1.1 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.55.1.1/YukkuriMovieMaker_v4.55.1.1_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 download failed.' }
          $hash=(Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b') { throw "YMM4 hash mismatch: $hash" }
          Expand-Archive -LiteralPath ymm4.zip -DestinationPath ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YMM4 exe missing.' }
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/probe | Out-Null
          dotnet build experiments/ymm4/template-clone-fidelity/src/Ymm4TemplateCloneProbe/Ymm4TemplateCloneProbe.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/probe --nologo -warnaserror 2>&1 | Tee-Object out/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Template clone fidelity probe build failed.' }
      - name: Install probe into temporary YMM4 host
        shell: pwsh
        run: |
          $dest=Join-Path $env:YMM4_DIR 'user\plugin\Ymm4TemplateCloneProbe'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item out/probe/Ymm4TemplateCloneProbe.dll $dest
      - name: Run native discovery
        shell: pwsh
        run: ./experiments/ymm4/template-clone-fidelity/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out/evidence')
      - name: Print compact evidence
        if: always()
        shell: pwsh
        run: |
          if(Test-Path out/evidence/result.txt){Get-Content out/evidence/result.txt}
          if(Test-Path out/evidence/surface.txt){Select-String -Path out/evidence/surface.txt -Pattern '^TYPE |^CTOR |^PROPERTY |^CLONE |^CLONE_PROPERTY |^CLONE_COLLECTION |^REBIND |^METHOD_CANDIDATE |^METHOD_CANDIDATE_COUNT|^JSON_|^ASSERT PASS' | Select-Object -First 800 | ForEach-Object {$_.Line}}
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-template-clone-fidelity
          path: |
            out/evidence/
            out/build.txt
            out/probe/Ymm4TemplateCloneProbe.dll
            dotnet-sdks.txt
          if-no-files-found: warn
          retention-days: 14
