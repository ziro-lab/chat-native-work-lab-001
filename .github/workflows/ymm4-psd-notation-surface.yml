name: YMM4 PSD notation surface

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/ymm4/psd-notation-surface/**'
      - '.github/workflows/ymm4-psd-notation-surface.yml'
  pull_request:
    paths:
      - 'experiments/ymm4/psd-notation-surface/**'
      - '.github/workflows/ymm4-psd-notation-surface.yml'

permissions:
  contents: read

concurrency:
  group: ymm4-psd-notation-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-scan:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks | Tee-Object -FilePath dotnet-sdks.txt
          if (-not (Select-String -Path dotnet-sdks.txt -Pattern '^10\.')) {
            throw '.NET 10 SDK is not present on the runner.'
          }

      - name: Download and verify exact YMM4 4.56.1.0 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.56.1.0/YukkuriMovieMaker_v4.56.1.0_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 download failed.' }
          $hash = (Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content ymm4-sha256.txt
          if ($hash -ne '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a') {
            throw "YMM4 hash mismatch: $hash"
          }
          Expand-Archive -LiteralPath ymm4.zip -DestinationPath ymm4
          $exe = Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YukkuriMovieMaker.exe not found.' }
          "YMM4_DIR=$($exe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build static probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/probe | Out-Null
          dotnet build experiments/ymm4/psd-notation-surface/Ymm4PsdNotationProbe.csproj -c Release -o out/probe --nologo -warnaserror 2>&1 | Tee-Object out/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed.' }

      - name: Scan managed YMM4 PSD surface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/evidence | Out-Null
          dotnet out/probe/Ymm4PsdNotationProbe.dll "$env:YMM4_DIR" (Join-Path $PWD 'out/evidence') 2>&1 | Tee-Object out/evidence/run.txt
          if ($LASTEXITCODE -ne 0) { throw 'PSD notation scan failed.' }

      - name: Record provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/evidence | Out-Null
          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $sourceHead = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $event.pull_request.head.sha } else { $env:GITHUB_SHA }
          [ordered]@{
            schema = 'chat-native-work-lab.provenance.v1'
            experiment = 'ymm4-psd-notation-surface'
            repository = $env:GITHUB_REPOSITORY
            source_head = $sourceHead
            checkout_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            runner_image = $env:ImageOS
            ymm4_version = '4.56.1.0 Lite'
            ymm4_zip_sha256 = if (Test-Path ymm4-sha256.txt) { (Get-Content -Raw ymm4-sha256.txt).Trim() } else { $null }
          } | ConvertTo-Json -Depth 4 | Set-Content out/evidence/provenance.json

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-psd-notation-surface
          path: |
            out/evidence/
            out/build.txt
            ymm4-sha256.txt
            dotnet-sdks.txt
          if-no-files-found: warn
          retention-days: 14
