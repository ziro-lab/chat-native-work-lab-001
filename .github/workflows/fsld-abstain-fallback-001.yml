name: fsld-abstain-fallback-001

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/audio/fsld-abstain-fallback-001/**'
      - 'experiments/audio/music-fit-core-001/**'
      - 'experiments/audio/fsld-musicfit-benchmark-001/**'
      - '.github/workflows/fsld-abstain-fallback-001.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/audio/fsld-abstain-fallback-001/**'
      - 'experiments/audio/music-fit-core-001/**'
      - 'experiments/audio/fsld-musicfit-benchmark-001/**'
      - '.github/workflows/fsld-abstain-fallback-001.yml'

permissions:
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Music Fit CPU dependencies
        run: python -m pip install -r experiments/audio/music-fit-core-001/requirements.txt
      - name: Select fallback on disjoint abstains and evaluate frozen holdout abstains
        working-directory: experiments/audio/fsld-abstain-fallback-001
        run: python run.py
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: fsld-abstain-fallback-001-evidence
          path: experiments/audio/fsld-abstain-fallback-001/out/report.json
          if-no-files-found: error
          retention-days: 14
