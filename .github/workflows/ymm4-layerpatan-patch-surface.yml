name: YMM4 LayerPatan patch surface
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/ymm4/layerpatan-patch-surface/**'
      - '.github/workflows/ymm4-layerpatan-patch-surface.yml'
permissions: { contents: read }
jobs:
  inspect:
    strategy:
      matrix:
        include:
          - version: '4.55.1.1'
            asset: 'YukkuriMovieMaker_v4.55.1.1_Lite.zip'
            sha256: '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b'
          - version: '4.56.1.0'
            asset: 'YukkuriMovieMaker_v4.56.1.0_Lite.zip'
            sha256: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - shell: pwsh
        run: |
          $url="https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v$($env:VER)/$($env:ASSET)"
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip $url
          if($env:EXPECTED){
            if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED){throw 'hash mismatch'}
          }
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          "YMM4_DIR=$($exe.Directory.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
        env:
          VER: ${{ matrix.version }}
          ASSET: ${{ matrix.asset }}
          EXPECTED: ${{ matrix.sha256 }}
      - shell: pwsh
        run: dotnet run --project experiments/ymm4/layerpatan-patch-surface/src/PatchSurfaceProbe/PatchSurfaceProbe.csproj -- "$env:YMM4_DIR" | Tee-Object "patch-surface-$($env:VER).txt"
        env:
          VER: ${{ matrix.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layerpatan-patch-surface-${{ matrix.version }}
          path: patch-surface-*.txt
          retention-days: 14
