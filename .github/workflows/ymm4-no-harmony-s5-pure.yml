name: YMM4 no-Harmony S5 visual summary pure
on:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-s5-visual-summary/**'
      - '.github/workflows/ymm4-no-harmony-s5-pure.yml'
permissions: { contents: read }
concurrency:
  group: no-harmony-s5-pure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - name: Reject host dependencies
        shell: bash
        run: |
          if grep -R -n -E 'YukkuriMovieMaker|System\.Windows|PresentationFramework|WindowsBase' experiments/ymm4/no-harmony-s5-visual-summary/src; then
            echo 'S5 visual projection must stay host-independent.'
            exit 1
          fi
      - name: Run S5 visual summary pure suite
        run: dotnet run --project experiments/ymm4/no-harmony-s5-visual-summary/tests/S5VisualSummaryTests.csproj -c Release
