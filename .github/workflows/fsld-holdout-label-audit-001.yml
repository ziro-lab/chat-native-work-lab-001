name: fsld-holdout-label-audit-001
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/audio/fsld-holdout-label-audit-001/**'
      - '.github/workflows/fsld-holdout-label-audit-001.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/audio/fsld-holdout-label-audit-001/**'
      - '.github/workflows/fsld-holdout-label-audit-001.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit fixed holdout labels from metadata only
        working-directory: experiments/audio/fsld-holdout-label-audit-001
        run: python audit_labels.py
      - uses: actions/upload-artifact@v4
        with:
          name: fsld-holdout-label-audit-001-evidence
          path: experiments/audio/fsld-holdout-label-audit-001/out/report.json
          if-no-files-found: error
          retention-days: 14
