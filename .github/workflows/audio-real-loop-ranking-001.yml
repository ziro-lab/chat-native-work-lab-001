name: audio-real-loop-ranking-001

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'experiments/audio/audio-real-loop-ranking-001/**'
      - '.github/workflows/audio-real-loop-ranking-001.yml'
  pull_request:
    paths:
      - 'experiments/audio/audio-real-loop-ranking-001/**'
      - '.github/workflows/audio-real-loop-ranking-001.yml'

permissions:
  contents: read

jobs:
  real-loop-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CPU inference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install beat-this==1.1.0 soundfile==0.13.1
          python -m pip freeze > real-loop-ranking-pip-freeze.txt

      - name: Run pinned real-audio benchmark
        working-directory: experiments/audio/audio-real-loop-ranking-001
        run: python verify.py

      - name: Show compact evidence
        if: always()
        working-directory: experiments/audio/audio-real-loop-ranking-001
        run: |
          test -f out/evidence.json && cat out/evidence.json || true

      - name: Upload metadata/results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-real-loop-ranking-001-evidence
          path: |
            real-loop-ranking-pip-freeze.txt
            experiments/audio/audio-real-loop-ranking-001/out/report.json
            experiments/audio/audio-real-loop-ranking-001/out/evidence.json
          if-no-files-found: warn
          retention-days: 14
