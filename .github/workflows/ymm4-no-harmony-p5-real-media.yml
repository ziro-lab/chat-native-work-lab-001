name: YMM4 no-Harmony P5 real media

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-p4-hands-on-candidate/**'
      - '.github/workflows/ymm4-no-harmony-p5-real-media.yml'

permissions:
  contents: read

concurrency:
  group: p5-real-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '4.55.1.1'
            sha256: '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b'
          - version: '4.56.1.0'
            sha256: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'

    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1

      - name: Acquire pinned host
        shell: pwsh
        env:
          HOST_VERSION: '${{ matrix.version }}'
          HOST_HASH: '${{ matrix.sha256 }}'
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip "https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v$env:HOST_VERSION/YukkuriMovieMaker_v$($env:HOST_VERSION)_Lite.zip"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED host download'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:HOST_HASH){throw 'BLOCKED host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          if(-not $exe){throw 'BLOCKED host executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create deterministic media fixtures
        shell: pwsh
        run: |
          $media=Join-Path $PWD 'out/media'
          New-Item -ItemType Directory -Force $media|Out-Null

          [IO.File]::WriteAllBytes((Join-Path $media 'fixture.png'),[Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAACXBIWXMAAAABAAAAAQBPJcTWAAAAFUlEQVR4nGNgYPhHIhrVMKph2GoAAAvM/gFuVngMAAAAAElFTkSuQmCC'))
          [IO.File]::WriteAllBytes((Join-Path $media 'fixture.mp4'),[Convert]::FromBase64String(''))

          $wav=Join-Path $media 'fixture.wav'
          $sampleRate=44100
          $channels=1
          $bits=16
          $seconds=1
          $samples=$sampleRate*$seconds
          $dataBytes=$samples*$channels*($bits/8)
          $fs=[IO.File]::Create($wav)
          try {
            $bw=[IO.BinaryWriter]::new($fs,[Text.Encoding]::ASCII,$true)
            try {
              $bw.Write([Text.Encoding]::ASCII.GetBytes('RIFF'))
              $bw.Write([int](36+$dataBytes))
              $bw.Write([Text.Encoding]::ASCII.GetBytes('WAVE'))
              $bw.Write([Text.Encoding]::ASCII.GetBytes('fmt '))
              $bw.Write([int]16)
              $bw.Write([int16]1)
              $bw.Write([int16]$channels)
              $bw.Write([int]$sampleRate)
              $bw.Write([int]($sampleRate*$channels*($bits/8)))
              $bw.Write([int16]($channels*($bits/8)))
              $bw.Write([int16]$bits)
              $bw.Write([Text.Encoding]::ASCII.GetBytes('data'))
              $bw.Write([int]$dataBytes)
              $bw.Write([byte[]]::new($dataBytes))
            } finally {$bw.Dispose()}
          } finally {$fs.Dispose()}

          $image=(Resolve-Path (Join-Path $media 'fixture.png')).Path
          $audio=(Resolve-Path $wav).Path
          $video=(Resolve-Path (Join-Path $media 'fixture.mp4')).Path
          "P5_IMAGE=$image"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "P5_AUDIO=$audio"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "P5_VIDEO=$video"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force out/evidence|Out-Null
          @(
            "image_sha256=$((Get-FileHash $image -Algorithm SHA256).Hash)",
            "audio_sha256=$((Get-FileHash $audio -Algorithm SHA256).Hash)",
            "video_sha256=$((Get-FileHash $video -Algorithm SHA256).Hash)"
          )|Set-Content out/evidence/media-fixtures.txt

      - name: Build candidate
        shell: pwsh
        run: |
          dotnet build experiments/ymm4/no-harmony-p4-hands-on-candidate/src/Plugin/Plugin.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/plugin --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Candidate build failed'}
          $harmony=Get-ChildItem out/plugin -File | Where-Object { $_.Name -in @('0Harmony.dll','HarmonyLib.dll') }
          if($harmony){throw ('Unexpected Harmony dependency: ' + ($harmony.Name -join ','))}
          $d=Join-Path $env:YMM4_DIR 'user\plugin\Ymm4NoHarmonyFolderHandsOn'
          New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item out/plugin/Ymm4NoHarmonyFolderHandsOn.dll $d
          @(
            "source_head=${{ github.event.pull_request.head.sha || github.sha }}",
            "host_version=${{ matrix.version }}",
            "host_zip_sha256=${{ matrix.sha256 }}",
            "candidate_sha256=$((Get-FileHash out/plugin/Ymm4NoHarmonyFolderHandsOn.dll -Algorithm SHA256).Hash)",
            "run=$env:GITHUB_RUN_ID"
          )|Set-Content out/evidence/manifest.txt

      - name: Run P5 real-media compatibility smoke
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class P5MediaWindow {
            public delegate bool Callback(IntPtr w, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Callback cb,IntPtr p);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr w);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr w,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr w,StringBuilder s,int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr w,uint m,IntPtr wp,IntPtr lp);
          }
          '@

          $diag=Join-Path $PWD 'out/evidence/smoke'
          New-Item -ItemType Directory -Force $diag|Out-Null
          $env:CNWL_P4_HANDS_ON_DIAG_DIR=$diag
          $env:CNWL_P4_HANDS_ON_SMOKE_CREATE_PROJECT='1'
          $env:CNWL_P5_MEDIA_COMPATIBILITY_SMOKE='1'
          $env:CNWL_P5_IMAGE_FILE=$env:P5_IMAGE
          $env:CNWL_P5_AUDIO_FILE=$env:P5_AUDIO
          $env:CNWL_P5_VIDEO_FILE=$env:P5_VIDEO

          $p=Start-Process (Join-Path $env:YMM4_DIR 'YukkuriMovieMaker.exe') -WorkingDirectory $env:YMM4_DIR -PassThru
          try {
            $script:hostPid=$p.Id
            $cb=[P5MediaWindow+Callback]{
              param([IntPtr]$w,[IntPtr]$unused)
              [uint32]$owner=0
              [void][P5MediaWindow]::GetWindowThreadProcessId($w,[ref]$owner)
              if($owner -eq $script:hostPid -and [P5MediaWindow]::IsWindowVisible($w)){
                $s=New-Object System.Text.StringBuilder 1024
                [void][P5MediaWindow]::GetWindowText($w,$s,1024)
                $title=$s.ToString()
                if($title -like '*Check for updates*' -or $title -like '*About YukkuriMovieMaker*'){
                  [void][P5MediaWindow]::PostMessage($w,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)
                }elseif($title -eq 'Confirm' -or $title -eq 'Profile'){
                  [void][P5MediaWindow]::PostMessage($w,0x0100,[IntPtr]0x0D,[IntPtr]::Zero)
                  [void][P5MediaWindow]::PostMessage($w,0x0101,[IntPtr]0x0D,[IntPtr]::Zero)
                }
              }
              return $true
            }

            $result=Join-Path $diag 'p5-media-result.txt'
            $deadline=[DateTime]::UtcNow.AddSeconds(150)
            while([DateTime]::UtcNow -lt $deadline -and -not $p.HasExited -and -not(Test-Path $result)){
              [void][P5MediaWindow]::EnumWindows($cb,[IntPtr]::Zero)
              Start-Sleep -Milliseconds 400
            }

            if(-not(Test-Path $result)){
              if(Test-Path (Join-Path $diag 'runtime.log')){Get-Content (Join-Path $diag 'runtime.log') -Tail 420|Write-Host}
              throw 'P5 media smoke did not produce a result'
            }

            $content=Get-Content $result
            $content|Write-Host
            if($content[0] -ne 'PASS_P5_MEDIA_REALISM'){
              if(Test-Path (Join-Path $diag 'runtime.log')){Get-Content (Join-Path $diag 'runtime.log') -Tail 420|Write-Host}
              throw 'P5 real-media compatibility failed'
            }
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            foreach($name in @(
              'CNWL_P4_HANDS_ON_DIAG_DIR',
              'CNWL_P4_HANDS_ON_SMOKE_CREATE_PROJECT',
              'CNWL_P5_MEDIA_COMPATIBILITY_SMOKE',
              'CNWL_P5_IMAGE_FILE',
              'CNWL_P5_AUDIO_FILE',
              'CNWL_P5_VIDEO_FILE'
            )){
              Remove-Item ("Env:"+$name) -ErrorAction SilentlyContinue
            }
          }

      - if: always()
        name: Show evidence
        shell: pwsh
        run: |
          if(Test-Path out/evidence/manifest.txt){Get-Content out/evidence/manifest.txt}
          if(Test-Path out/evidence/media-fixtures.txt){Get-Content out/evidence/media-fixtures.txt}
          if(Test-Path out/evidence/smoke/p5-media-result.txt){Get-Content out/evidence/smoke/p5-media-result.txt}
          if(Test-Path out/evidence/smoke/runtime.log){Get-Content out/evidence/smoke/runtime.log -Tail 420}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-no-harmony-p5-real-media-${{ matrix.version }}
          path: out/evidence/
          retention-days: 30
