name: YMM4 plugin host validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/ymm4/plugin-host-validation/**'
      - '.github/workflows/ymm4-plugin-host-validation.yml'
  pull_request:
    paths:
      - 'experiments/ymm4/plugin-host-validation/**'
      - '.github/workflows/ymm4-plugin-host-validation.yml'

permissions:
  contents: read

concurrency:
  group: ymm4-plugin-host-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-proof:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks | Tee-Object -FilePath dotnet-sdks.txt
          if (-not (Select-String -Path dotnet-sdks.txt -Pattern '^10\.')) {
            throw '.NET 10 SDK is not present on the runner.'
          }

      - name: Download and verify exact YMM4 4.55.1.1 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.55.1.1/YukkuriMovieMaker_v4.55.1.1_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 download failed.' }
          $hash = (Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b') {
            throw "YMM4 hash mismatch: $hash"
          }
          Expand-Archive -LiteralPath ymm4.zip -DestinationPath ymm4
          $exe = Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YukkuriMovieMaker.exe not found.' }
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build minimal probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/probe | Out-Null
          dotnet build experiments/ymm4/plugin-host-validation/src/Ymm4HostProbe/Ymm4HostProbe.csproj `
            -c Release `
            "-p:YMM4DirPath=$env:YMM4_DIR" `
            -o out/probe `
            --nologo `
            -warnaserror 2>&1 | Tee-Object out/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed.' }
          $dll = Join-Path $PWD 'out/probe/Ymm4HostProbe.dll'
          if (-not (Test-Path $dll)) { throw 'Probe DLL was not produced.' }
          Get-FileHash $dll -Algorithm SHA256 | Format-List | Out-File out/probe-sha256.txt

      - name: Install probe into temporary YMM4 host
        shell: pwsh
        run: |
          $dest = Join-Path $env:YMM4_DIR 'user\plugin\Ymm4HostProbe'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item out/probe/Ymm4HostProbe.dll (Join-Path $dest 'Ymm4HostProbe.dll')

      - name: Launch real YMM4 and require callback
        shell: pwsh
        run: |
          ./experiments/ymm4/plugin-host-validation/RunNative.ps1 `
            -Ymm4Dir $env:YMM4_DIR `
            -OutputDir (Join-Path $PWD 'out/evidence')

      - name: Record provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/evidence | Out-Null
          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $sourceHead = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $event.pull_request.head.sha } else { $env:GITHUB_SHA }
          $probeHash = if (Test-Path out/probe/Ymm4HostProbe.dll) { (Get-FileHash out/probe/Ymm4HostProbe.dll -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          $result = if (Test-Path out/evidence/result.txt) { (Get-Content -Raw out/evidence/result.txt).Trim() } else { 'NO_RESULT' }
          [ordered]@{
            schema = 'chat-native-work-lab.provenance.v1'
            experiment = 'ymm4-plugin-host-validation'
            repository = $env:GITHUB_REPOSITORY
            source_head = $sourceHead
            checkout_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            runner_image = $env:ImageOS
            ymm4_version = '4.55.1.1 Lite'
            ymm4_zip_sha256 = '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b'
            probe_dll_sha256 = $probeHash
            result = $result
          } | ConvertTo-Json -Depth 4 | Set-Content out/evidence/provenance.json

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-plugin-host-validation
          path: |
            out/evidence/
            out/build.txt
            out/probe-sha256.txt
            out/probe/Ymm4HostProbe.dll
            dotnet-sdks.txt
          if-no-files-found: warn
          retention-days: 14
