name: music-fit-core-001
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/audio/music-fit-core-001/**'
      - '.github/workflows/music-fit-core-001.yml'
permissions:
  contents: read
concurrency:
  group: music-fit-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install small CPU stack
        run: python -m pip install -r experiments/audio/music-fit-core-001/requirements.txt
      - name: Test reusable component
        working-directory: experiments/audio/music-fit-core-001
        run: python -m unittest discover -s tests -v
      - name: Synthetic discovery-to-render benchmark
        working-directory: experiments/audio/music-fit-core-001
        run: python benchmark.py --output out-synthetic
      - name: Pinned real-audio diagnostic benchmark
        if: runner.os == 'Linux'
        working-directory: experiments/audio/music-fit-core-001
        run: python benchmark.py --real --output out-real
      - name: Ten-minute synthetic streaming smoke
        working-directory: experiments/audio/music-fit-core-001
        run: python scale_check.py
      - name: Record source and actual checkout identity
        shell: bash
        run: |
          python -m pip freeze > music-fit-pip-freeze.txt
          git rev-parse HEAD > music-fit-checkout.txt
          git rev-parse HEAD^{tree} >> music-fit-checkout.txt
          printf '%s\n' "$SOURCE_HEAD_SHA" >> music-fit-checkout.txt
      - name: Upload reports only, never third-party audio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: music-fit-core-${{ runner.os }}-evidence
          path: |
            experiments/audio/music-fit-core-001/out-synthetic/report.json
            experiments/audio/music-fit-core-001/out-real/report.json
            experiments/audio/music-fit-core-001/scale-report.json
            music-fit-pip-freeze.txt
            music-fit-checkout.txt
          if-no-files-found: error
          retention-days: 14
