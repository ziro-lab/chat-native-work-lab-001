name: fsld-min-sim-tuning-001
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/audio/fsld-min-sim-tuning-001/**'
      - '.github/workflows/fsld-min-sim-tuning-001.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/audio/fsld-min-sim-tuning-001/**'
      - '.github/workflows/fsld-min-sim-tuning-001.yml'
permissions:
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r experiments/audio/music-fit-core-001/requirements.txt
      - name: Tune one existing scalar on creator-disjoint train/validation sets
        working-directory: experiments/audio/fsld-min-sim-tuning-001
        run: python run_tuning.py
      - uses: actions/upload-artifact@v4
        with:
          name: fsld-min-sim-tuning-001-evidence
          path: experiments/audio/fsld-min-sim-tuning-001/out/report.json
          if-no-files-found: error
          retention-days: 14
