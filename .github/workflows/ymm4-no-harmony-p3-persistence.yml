name: YMM4 no-Harmony P3 persistence pure
on:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-p3-persistence/src/**'
      - 'experiments/ymm4/no-harmony-p3-persistence/tests/**'
      - '.github/workflows/ymm4-no-harmony-p3-persistence.yml'
permissions: { contents: read }
concurrency:
  group: p3-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - name: Reject host dependencies in persistence model
        shell: bash
        run: |
          if grep -R -n -E 'YukkuriMovieMaker|System\.Windows|PresentationFramework|WindowsBase' experiments/ymm4/no-harmony-p3-persistence/src; then
            echo 'Persistence core must stay host-independent.'
            exit 1
          fi
      - name: Run pure persistence suite
        run: dotnet run --project experiments/ymm4/no-harmony-p3-persistence/tests/PersistenceTests.csproj -c Release
