name: YMM4 timeline selection context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/ymm4/timeline-selection-context/**'
      - '.github/workflows/ymm4-timeline-selection-context.yml'
  pull_request:
    paths:
      - 'experiments/ymm4/timeline-selection-context/**'
      - '.github/workflows/ymm4-timeline-selection-context.yml'

permissions:
  contents: read

concurrency:
  group: ymm4-timeline-selection-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-discovery:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks | Tee-Object -FilePath dotnet-sdks.txt
          if (-not (Select-String -Path dotnet-sdks.txt -Pattern '^10\.')) { throw '.NET 10 SDK missing' }

      - name: Download and verify exact YMM4 4.55.1.1 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.55.1.1/YukkuriMovieMaker_v4.55.1.1_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 download failed.' }
          $hash=(Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b') { throw "YMM4 hash mismatch: $hash" }
          Expand-Archive -LiteralPath ymm4.zip -DestinationPath ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YMM4 exe missing.' }
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build selection probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/probe | Out-Null
          dotnet build experiments/ymm4/timeline-selection-context/src/Ymm4SelectionProbe/Ymm4SelectionProbe.csproj `
            -c Release `
            "-p:YMM4DirPath=$env:YMM4_DIR" `
            -o out/probe `
            --nologo `
            -warnaserror 2>&1 | Tee-Object out/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Selection probe build failed.' }
          Get-FileHash out/probe/Ymm4SelectionProbe.dll -Algorithm SHA256 | Format-List | Out-File out/probe-sha256.txt

      - name: Install probe into temporary YMM4 host
        shell: pwsh
        run: |
          $dest=Join-Path $env:YMM4_DIR 'user\plugin\Ymm4SelectionProbe'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item out/probe/Ymm4SelectionProbe.dll $dest

      - name: Run discovery and behavior proof inside real YMM4
        shell: pwsh
        run: |
          ./experiments/ymm4/timeline-selection-context/RunNative.ps1 `
            -Ymm4Dir $env:YMM4_DIR `
            -OutputDir (Join-Path $PWD 'out/evidence')

      - name: Print compact evidence
        if: always()
        shell: pwsh
        run: |
          foreach ($file in @('result.txt','behavior-result.txt','timeline-fixture.txt','behavior-surface.txt','selection-surface.txt')) {
            $path=Join-Path 'out/evidence' $file
            if (Test-Path $path) {
              Write-Host "=== $file ==="
              Get-Content $path
            }
          }

      - name: Record provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/evidence | Out-Null
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $sourceHead=if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $event.pull_request.head.sha } else { $env:GITHUB_SHA }
          $probeHash=if (Test-Path out/probe/Ymm4SelectionProbe.dll) { (Get-FileHash out/probe/Ymm4SelectionProbe.dll -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          $discovery=if (Test-Path out/evidence/result.txt) { (Get-Content -Raw out/evidence/result.txt).Trim() } else { 'NO_RESULT' }
          $behavior=if (Test-Path out/evidence/behavior-result.txt) { (Get-Content -Raw out/evidence/behavior-result.txt).Trim() } else { 'NO_BEHAVIOR_RESULT' }
          [ordered]@{
            schema='chat-native-work-lab.provenance.v1'
            experiment='ymm4-timeline-selection-context-002'
            phase='runtime-behavior-proof'
            repository=$env:GITHUB_REPOSITORY
            source_head=$sourceHead
            checkout_sha=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            run_url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runner_os=$env:RUNNER_OS
            runner_arch=$env:RUNNER_ARCH
            runner_image=$env:ImageOS
            ymm4_version='4.55.1.1 Lite'
            ymm4_zip_sha256='125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b'
            probe_dll_sha256=$probeHash
            discovery_result=$discovery
            behavior_result=$behavior
          } | ConvertTo-Json -Depth 4 | Set-Content out/evidence/provenance.json

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-timeline-selection-context
          path: |
            out/evidence/
            out/build.txt
            out/probe-sha256.txt
            out/probe/Ymm4SelectionProbe.dll
            dotnet-sdks.txt
          if-no-files-found: warn
          retention-days: 14
