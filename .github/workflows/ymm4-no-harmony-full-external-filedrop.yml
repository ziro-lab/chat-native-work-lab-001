name: YMM4 no-Harmony full external FileDrop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-p4-hands-on-candidate/**'
      - 'experiments/ymm4/no-harmony-track-a/src/Probe/Host.cs'
      - 'experiments/ymm4/no-harmony-folder-layout-generalization/src/Probe/FolderLayout.cs'
      - 'experiments/ymm4/no-harmony-track-c/src/Probe/GestureDisplay.cs'
      - 'experiments/ymm4/no-harmony-track-c/src/Probe/InputMapAdapter.cs'
      - 'experiments/ymm4/no-harmony-track-c/src/Probe/FileDropAdapter.cs'
      - 'experiments/ymm4/no-harmony-file-drop-correction/src/ExternalDragSource/**'
      - '.github/workflows/ymm4-no-harmony-full-external-filedrop.yml'

permissions: { contents: read }

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '4.55.1.1'
            asset: 'YukkuriMovieMaker_v4.55.1.1_Lite.zip'
            sha256: '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b'
          - version: '4.56.1.0'
            asset: 'YukkuriMovieMaker_v4.56.1.0_Lite.zip'
            sha256: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }

      - name: Acquire pinned YMM4
        shell: pwsh
        env:
          VER: '${{ matrix.version }}'
          ASSET: '${{ matrix.asset }}'
          EXPECTED: '${{ matrix.sha256 }}'
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip "https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v$env:VER/$env:ASSET"
          if($LASTEXITCODE -ne 0){throw 'host download failed'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED){throw 'host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          if(-not $exe){throw 'YMM4 executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build full product and external drag source
        shell: pwsh
        run: |
          dotnet build experiments/ymm4/no-harmony-p4-hands-on-candidate/src/Plugin/Plugin.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/product --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'product build failed'}
          dotnet build experiments/ymm4/no-harmony-file-drop-correction/src/ExternalDragSource/ExternalDragSource.csproj -c Release -o out/source --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'source build failed'}

          $pluginDir=Join-Path $env:YMM4_DIR 'user\plugin\CNWL_FullExternalFileDrop'
          New-Item -ItemType Directory -Force $pluginDir|Out-Null
          Copy-Item out/product/Ymm4NoHarmonyFolderHandsOn.dll $pluginDir
          if(Test-Path out/product/0Harmony.dll){throw 'unexpected Harmony'}

      - name: Execute full product external FileDrop
        shell: pwsh
        run: |
          ./experiments/ymm4/no-harmony-p4-hands-on-candidate/RunExternalFileDropSmoke.ps1 -Ymm4Dir $env:YMM4_DIR -SourceExe (Resolve-Path 'out/source/ExternalDragSource.exe').Path -OutputDir (Join-Path $PWD 'out/evidence')

      - if: always()
        name: Show evidence
        shell: pwsh
        run: |
          foreach($f in @(
            'p7-external-filedrop-result.txt',
            'p7-external-filedrop-source.txt',
            'runtime.log',
            'ready.txt'
          )){
            $p=Join-Path 'out/evidence' $f
            if(Test-Path $p){
              Write-Host "=== $f ==="
              Get-Content $p
            }
          }

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-no-harmony-full-external-filedrop-${{ matrix.version }}
          path: out/evidence/
          retention-days: 14
