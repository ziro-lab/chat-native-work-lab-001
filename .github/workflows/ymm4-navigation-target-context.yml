name: YMM4 navigation target context
on:
  workflow_dispatch:
  push:
    branches: ['experiment/highlight-navigator-context-v1']
    paths:
      - 'experiments/ymm4/navigation-target-context/src/**'
      - 'experiments/ymm4/navigation-target-context/RunNative.ps1'
      - '.github/workflows/ymm4-navigation-target-context.yml'
permissions:
  contents: read
concurrency:
  group: navigation-target-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-context:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build environment and pinned host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet --list-sdks | Tee-Object dotnet-sdks.txt
          if(-not(Select-String dotnet-sdks.txt -Pattern '^10\.')){throw '.NET 10 SDK missing'}
          curl.exe -L --fail --retry 2 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.56.1.0/YukkuriMovieMaker_v4.56.1.0_Lite.zip
          if($LASTEXITCODE -ne 0){throw 'Host download blocked'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'){throw 'Host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if(-not $exe){throw 'Host executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          choco install ffmpeg --version=7.1.1 -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'Fixture FFmpeg installation blocked'}
          New-Item -ItemType Directory -Force out/fixture | Out-Null
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=64x36:rate=60:duration=30' -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p out/fixture/source.mp4
          if($LASTEXITCODE -ne 0){throw 'Fixture generation failed'}
      - name: Build and install probe
        shell: pwsh
        run: |
          dotnet build experiments/ymm4/navigation-target-context/src/Ymm4NavigationContextProbe/Ymm4NavigationContextProbe.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/probe --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Probe build failed'}
          $dest=Join-Path $env:YMM4_DIR 'user/plugin/Ymm4NavigationContextProbe'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item out/probe/Ymm4NavigationContextProbe.dll $dest
      - name: Real host assertions and independent evidence gate
        shell: pwsh
        run: ./experiments/ymm4/navigation-target-context/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out/evidence') -MediaPath (Join-Path $PWD 'out/fixture/source.mp4')
      - name: Record run provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/evidence | Out-Null
          $dll=if(Test-Path out/probe/Ymm4NavigationContextProbe.dll){(Get-FileHash out/probe/Ymm4NavigationContextProbe.dll -Algorithm SHA256).Hash.ToLowerInvariant()}else{$null}
          @{source_head=$env:GITHUB_SHA;checkout_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;host='4.56.1.0 Lite';host_sha256='49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a';probe_sha256=$dll} | ConvertTo-Json | Set-Content out/evidence/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: navigation-target-context
          path: |
            out/evidence/
            dotnet-sdks.txt
          if-no-files-found: error
          retention-days: 7
