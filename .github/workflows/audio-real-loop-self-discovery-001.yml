name: audio-real-loop-self-discovery-001

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'experiments/audio/audio-real-loop-self-discovery-001/**'
      - '.github/workflows/audio-real-loop-self-discovery-001.yml'
  pull_request:
    paths:
      - 'experiments/audio/audio-real-loop-self-discovery-001/**'
      - '.github/workflows/audio-real-loop-self-discovery-001.yml'

permissions:
  contents: read

jobs:
  self-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight analysis dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.3
          python -m pip freeze > self-discovery-pip-freeze.txt

      - name: Run single-track loop discovery
        working-directory: experiments/audio/audio-real-loop-self-discovery-001
        run: python verify.py

      - name: Show compact evidence
        if: always()
        working-directory: experiments/audio/audio-real-loop-self-discovery-001
        run: |
          test -f out/evidence.json && cat out/evidence.json || true

      - name: Upload metadata/results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-real-loop-self-discovery-001-evidence
          path: |
            self-discovery-pip-freeze.txt
            experiments/audio/audio-real-loop-self-discovery-001/out/report.json
            experiments/audio/audio-real-loop-self-discovery-001/out/evidence.json
          if-no-files-found: warn
          retention-days: 14
