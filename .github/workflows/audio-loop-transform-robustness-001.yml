name: audio-loop-transform-robustness-001

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'experiments/audio/audio-loop-recovery-001/**'
      - 'experiments/audio/audio-loop-dsp-baseline-001/**'
      - 'experiments/audio/audio-loop-transform-robustness-001/**'
      - '.github/workflows/audio-loop-transform-robustness-001.yml'
  pull_request:
    paths:
      - 'experiments/audio/audio-loop-recovery-001/**'
      - 'experiments/audio/audio-loop-dsp-baseline-001/**'
      - 'experiments/audio/audio-loop-transform-robustness-001/**'
      - '.github/workflows/audio-loop-transform-robustness-001.yml'

permissions:
  contents: read

jobs:
  transform-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CPU inference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install beat-this==1.1.0 soundfile==0.13.1
          python -m pip freeze > loop-transform-pip-freeze.txt

      - name: Run transformed-loop robustness benchmark
        working-directory: experiments/audio/audio-loop-transform-robustness-001
        run: python verify.py

      - name: Show compact evidence
        if: always()
        working-directory: experiments/audio/audio-loop-transform-robustness-001
        run: |
          test -f out/evidence.json && cat out/evidence.json || true

      - name: Upload transformed-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-loop-transform-robustness-001-evidence
          path: |
            loop-transform-pip-freeze.txt
            experiments/audio/audio-loop-transform-robustness-001/out/manifest.json
            experiments/audio/audio-loop-transform-robustness-001/out/report.json
            experiments/audio/audio-loop-transform-robustness-001/out/evidence.json
          if-no-files-found: warn
          retention-days: 14
