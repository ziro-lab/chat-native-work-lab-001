name: YMM4 no-Harmony P2 navigation smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/ymm4/no-harmony-p2-navigation/**'
      - '.github/workflows/ymm4-no-harmony-p2-navigation.yml'
permissions: { contents: read }
concurrency:
  group: p2-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - name: Run host-independent navigation policy
        run: dotnet run --project experiments/ymm4/no-harmony-p2-navigation/tests/PolicyTests.csproj -c Release
  native:
    needs: pure
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      HOST_VERSION: '4.56.1.0'
      HOST_HASH: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - name: Acquire pinned development host
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip "https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v$env:HOST_VERSION/YukkuriMovieMaker_v$($env:HOST_VERSION)_Lite.zip"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED host download'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:HOST_HASH){throw 'BLOCKED host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe|Select-Object -First 1
          if(-not $exe){throw 'BLOCKED host executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build selection navigation candidate
        shell: pwsh
        env: { SOURCE_HEAD: '${{ github.event.pull_request.head.sha || github.sha }}' }
        run: |
          dotnet build experiments/ymm4/no-harmony-p2-navigation/native/src/Probe/Probe.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/probe --nologo -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          $d=Join-Path $env:YMM4_DIR 'user\plugin\CNWL_P2Navigation'
          New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item out/probe/Ymm4P2NavigationProbe.dll $d
          if(Get-ChildItem out/probe -Filter '*Harmony*.dll'){throw 'Unexpected Harmony dependency'}
          New-Item -ItemType Directory -Force out/evidence|Out-Null
          $checkout=git rev-parse HEAD
          $tree=git rev-parse 'HEAD^{tree}'
          @("source_head=$env:SOURCE_HEAD","checkout=$checkout","tree=$tree","host_version=$env:HOST_VERSION","host_zip_sha256=$env:HOST_HASH","probe_sha256=$((Get-FileHash out/probe/Ymm4P2NavigationProbe.dll -Algorithm SHA256).Hash)","run=$env:GITHUB_RUN_ID","level=V1")|Set-Content out/evidence/manifest.txt
      - name: Exercise real selection-triggered folded navigation
        shell: pwsh
        run: ./experiments/ymm4/no-harmony-p2-navigation/native/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out/evidence')
      - if: always()
        name: Show results
        shell: pwsh
        run: |
          foreach($f in @('manifest.txt','result.json','error.txt')){$p=Join-Path 'out/evidence' $f;if(Test-Path $p){Write-Host "=== $f ===";Get-Content $p}}
          if(Test-Path out/evidence/progress.txt){Get-Content out/evidence/progress.txt -Tail 80}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymm4-no-harmony-p2-navigation-4.56.1.0
          path: out/evidence/
          retention-days: 14
